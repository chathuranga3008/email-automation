<div class="create-recipient-page">
  <div class="page-heading">
    <div>
      <h2>Create Recipient</h2>
      <p>Add a new email recipient to the system.</p>
    </div>
  </div>

  <div class="form-card">
    <form #recipientForm="ngForm" (ngSubmit)="createRecipient()">
      <div class="form-group">
        <label for="recipientName"> Recipient Name <span>*</span> </label>

        <input
          id="recipientName"
          name="recipientName"
          type="text"
          [(ngModel)]="recipientName"
          (ngModelChange)="saveDraft()"
          placeholder="Enter recipient name"
          maxlength="200"
          required
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label for="emailAddress"> Email Address <span>*</span> </label>

        <input
          id="emailAddress"
          name="emailAddress"
          type="email"
          [(ngModel)]="emailAddress"
          (ngModelChange)="saveDraft()"
          placeholder="e.g. recipient@example.com"
          maxlength="254"
          required
          email
          [disabled]="loading"
          #emailInput="ngModel"
        />

        <small class="validation-message" *ngIf="emailInput.invalid && emailInput.touched">
          Please enter a valid email address.
        </small>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="form-actions">
        <button type="button" class="cancel-button" (click)="cancel()" [disabled]="loading">
          Cancel
        </button>

        <button type="submit" class="save-button" [disabled]="loading || recipientForm.invalid">
          {{ loading ? 'Creating...' : 'Create Recipient' }}
        </button>
      </div>
    </form>
  </div>
</div>
