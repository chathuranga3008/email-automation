<div class="app-layout">
  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">EA</div>
      <div class="brand-name">
        <h2>Email Automation</h2>
        <span>Management Portal</span>
      </div>
    </div>

    <div class="sidebar-section">
      <span class="section-label">MAIN MENU</span>

      <nav class="navigation">
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item"
        >
          <span class="nav-icon">▦</span>
          <span>Dashboard</span>
        </a>

        <a routerLink="/send-emails" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">✉</span>
          <span>Send Emails</span>
        </a>

        <a routerLink="/email-templates" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">▤</span>
          <span>Email Templates</span>
        </a>

        <a routerLink="/email-history" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">◷</span>
          <span>Email History</span>
        </a>

        <a routerLink="/recipients" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">♙</span>
          <span>Recipients</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-footer">
      <span>EMAIL AUTOMATION SYSTEM</span>
      <span>Version 1.0</span>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <header class="top-header">
      <div>
        <h1>Email Automation System</h1>
        <p>Manage your email operations</p>
      </div>

      <div class="user-profile">
        <div class="user-avatar">A</div>
        <div class="user-details">
          <strong>Administrator</strong>
          <span>System Admin</span>
        </div>
      </div>
    </header>

    <section class="page-content">
      <router-outlet />
    </section>
  </main>
</div>
